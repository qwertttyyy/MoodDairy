# Раздача SPA + прокси на backend (gunicorn). Кладётся в /etc/nginx/conf.d/default.conf.

# Перед этим nginx стоит внешний reverse proxy на хосте, который терминирует TLS.
# Если он уже прислал X-Forwarded-Proto — сохраняем значение, иначе берём свою схему.
# Иначе Django (SECURE_PROXY_SSL_HEADER) считал бы https-запросы обычным http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # DNS докера: имя backend разрешается в момент запроса, а не при старте.
    # Так nginx поднимается независимо от порядка запуска контейнеров
    # и подхватывает новый IP после пересборки backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Наследуются всеми location с proxy_pass ниже
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/ {
        proxy_pass $backend_upstream;
    }

    location /admin/ {
        proxy_pass $backend_upstream;
    }

    # Статика админки и DRF — отдаёт whitenoise внутри gunicorn
    location /static/ {
        proxy_pass $backend_upstream;
    }

    # Точка входа SPA: имя не хэшируется, кэшировать нельзя
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Сборка Vite: имена файлов содержат хэш контента
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
