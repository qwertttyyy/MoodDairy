# Пример для самостоятельного размещения Moods через nginx.
# Замените moods.example.com и пути сертификатов на свои значения.

upstream moods_django {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name moods.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name moods.example.com;

    ssl_certificate /etc/letsencrypt/live/moods.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moods.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/moods;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 10m;

    access_log /var/log/nginx/moods.access.log;
    error_log /var/log/nginx/moods.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://moods_django;
    }

    location /admin/ {
        proxy_pass http://moods_django;
    }

    location /static/ {
        proxy_pass http://moods_django;
    }

    # Имена production assets содержат content hash. Старые файлы можно
    # сохранять, чтобы уже открытые вкладки продолжали работать после деплоя.
    location /assets/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location /icons/ {
        access_log off;
        expires 1d;
        try_files $uri =404;
    }

    # Эти файлы должны быстро обновляться при публикации новой версии PWA.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        expires -1;
        try_files $uri =404;
    }

    location = /theme-init.js {
        default_type application/javascript;
        expires -1;
        try_files $uri =404;
    }

    # Прямые переходы на /share/<token>/ и другие маршруты открывают SPA.
    # /assets/ и /icons/ обработаны выше и при отсутствии остаются 404.
    location / {
        try_files $uri /index.html;
    }
}
