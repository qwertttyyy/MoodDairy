name: Test & Deploy

on:
  push:
    branches: [master]

run-name: Deploy master by @${{ github.actor }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.job != 'deploy' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'backend/**'
              - 'docker-compose.test.yml'
            frontend:
              - 'frontend/**'
            deploy:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.yml'
              - 'docker-compose.test.yml'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run tests
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from backend

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Production build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, test, frontend-checks]
    if: |
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs['frontend-checks'].result == 'success' || needs['frontend-checks'].result == 'skipped')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30s
          command_timeout: 15m
          script: |
            set -e
            cd /opt/projects/MoodDairy
            git fetch origin master
            git reset --hard origin/master

            docker run --rm -v "$PWD/frontend":/app -w /app node:22-alpine \
              sh -c "npm ci && npm run build"
            mkdir -p /var/www/moods
            cp -a frontend/dist/. /var/www/moods/

            docker compose build backend
            docker compose up -d --remove-orphans backend

      - name: Notify on success
        if: success()
        run: echo "✅ Deploy successful"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deploy failed"
