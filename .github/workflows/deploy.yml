name: Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Checks for PR #{0}', github.event.number)
      || format('Deploy master by @{0}', github.actor) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.test.yml'
            frontend:
              - 'frontend/**'
            deploy:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.yml'
              - 'docker-compose.test.yml'

  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Deployment checklist
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-key-long-enough-to-pass-the-length-check-000000
          ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          DB_PASSWORD: ci
          REDIS_PASSWORD: ci

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run tests
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from backend

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Production build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, backend-checks, backend-tests]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.backend == 'true' &&
      needs.backend-checks.result == 'success' &&
      needs.backend-tests.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ needs.changes.outputs.image }}:sha-${{ github.sha }}
            ${{ needs.changes.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, backend-checks, backend-tests, frontend-checks, build-image]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.changes.outputs.deploy == 'true' &&
      needs.backend-checks.result != 'failure' &&
      needs.backend-tests.result != 'failure' &&
      needs.frontend-checks.result != 'failure' &&
      needs.build-image.result != 'failure'
    steps:
      - name: Download frontend build
        if: needs.frontend-checks.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Copy frontend to server
        if: needs.frontend-checks.result == 'success'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: dist/*
          target: /var/www/moods
          strip_components: 1
          overwrite: true

      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ needs.changes.outputs.image }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30s
          command_timeout: 15m
          envs: IMAGE_NAME
          script: |
            set -e
            cd /opt/projects/MoodDairy

            git fetch origin master
            git checkout --force ${{ github.sha }} -- \
              docker-compose.yml docker-compose.test.yml

            echo "${{ secrets.GHCR_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export BACKEND_IMAGE="${IMAGE_NAME}:sha-${{ github.sha }}"
            docker compose pull backend
            docker compose up -d --remove-orphans backend

            docker image prune -f --filter "until=168h"

      - name: Verify service is healthy
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ needs.changes.outputs.image }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: IMAGE_NAME
          script: |
            set -e
            for attempt in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/api/health/ > /dev/null; then
                echo "✅ Сервис отвечает"
                exit 0
              fi
              echo "Попытка $attempt: сервис ещё не готов"
              sleep 3
            done

            echo "❌ Сервис не поднялся. Логи:"
            cd /opt/projects/MoodDairy && docker compose logs --tail=40 backend || true
            echo ""
            echo "Откат на предыдущий выпуск:"
            echo "  BACKEND_IMAGE=${IMAGE_NAME}:sha-<коммит> docker compose up -d backend"
            exit 1
