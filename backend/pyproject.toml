[project]
name = "mooddiary-backend"
version = "1.2.0"
description = "API дневника настроения с клиентским шифрованием: Django + DRF"
requires-python = "==3.12.*"

dependencies = [
    "Django==6.0.2",
    "djangorestframework==3.16.1",
    "psycopg2-binary==2.9.11",
    "gunicorn>=23.0",
    "python-dotenv==1.2.1",
    "redis[hiredis]>=5.0",
    "django-redis==6.0.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "coverage>=7.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "DJ",
    "S",
    "T20",
]

[tool.ruff.lint.per-file-ignores]
"*/tests.py" = ["S101", "S105", "S106", "SLF001"]
"*/tests/*" = ["S101", "S105", "S106", "SLF001"]
"manage.py" = ["T20"]
"*/management/commands/*" = ["S311"]

[tool.coverage.run]
source = ["accounts", "core", "entries", "sharing"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/apps.py",
    "config/asgi.py",
    "config/wsgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
